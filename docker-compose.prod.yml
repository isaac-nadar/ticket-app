services:
  web:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      DATABASE_URL: postgresql://kanban:kanban@postgres:5432/kanban
      REDIS_HOST: redis
      REDIS_PORT: 6379
    build:
      context: ./apps/web
    container_name: kanban-web
    ports:
      - "3000:3000"
    env_file:
      - ./apps/web/.env.local
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: kanban-postgres
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanban
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: kanban-redis

volumes:
  postgres_data:
