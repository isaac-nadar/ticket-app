services:
  postgres:
    image: postgres:16
    container_name: kanban-postgres
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanban
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: kanban-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
